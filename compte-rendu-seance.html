<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compte-rendu de séance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0E11; --steel:#1B1F22; --steel-line:#2C3134;
    --paper:#F6F4EF; --fog:#9AA0A6; --blue:#3E8EFF; --blue-dim:#173A63;
    --ok:#38D97A; --err:#FF6B6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--paper);font-family:'Work Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:32px 20px 60px;}

  .eyebrow{display:flex;align-items:center;gap:8px;font-size:0.72rem;letter-spacing:0.14em;font-weight:700;color:var(--blue);text-transform:uppercase;margin-bottom:12px;}
  .eyebrow::before{content:"";width:8px;height:8px;background:var(--blue);border-radius:50%;box-shadow:0 0 0 4px var(--blue-dim);}
  h1{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;line-height:0.95;margin:0 0 10px;}
  .sub{color:var(--fog);font-size:0.92rem;line-height:1.5;margin:0 0 28px;}

  .card{background:var(--steel);border:1px solid var(--steel-line);border-radius:14px;padding:18px;margin-bottom:16px;}
  label{display:block;font-size:0.74rem;font-weight:700;color:var(--fog);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;}
  .field{margin-bottom:12px;}
  input[type=text], input[type=date], select, textarea{
    width:100%;background:var(--ink);border:1.5px solid var(--steel-line);border-radius:9px;
    padding:12px;color:var(--paper);font-family:'Work Sans',sans-serif;font-size:0.95rem;
  }
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--blue);}
  ::placeholder{color:#5c6266;}
  textarea{resize:vertical;min-height:60px;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .ex-card{background:var(--ink);border:1.5px solid var(--steel-line);border-radius:12px;padding:14px 14px 4px;margin-bottom:12px;}
  .ex-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .ex-head input{flex:1;font-weight:700;}
  .ex-head .ex-title{flex:1;font-weight:700;font-size:0.98rem;}
  .rm-btn{background:none;border:none;color:var(--err);font-size:1.15rem;cursor:pointer;padding:6px;}

  .objectif-box{
    background:var(--blue-dim);border:1px solid rgba(62,142,255,0.35);border-radius:9px;
    padding:9px 12px;margin-bottom:12px;font-size:0.82rem;color:#CFE3FF;
  }
  .objectif-box b{color:#fff;}
  .section-tag{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--fog);margin:0 0 8px;}

  .btn{border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:0.9rem;cursor:pointer;font-family:'Work Sans',sans-serif;width:100%;}
  .btn-ghost{background:transparent;color:var(--paper);border:1.5px solid var(--steel-line);}
  .btn-blue{background:var(--blue);color:#071527;position:relative;overflow:hidden;}
  .btn-blue .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:rgba(0,0,0,0.18);transition:width .8s ease;}
  .btn-blue .label{position:relative;}

  .error-msg{display:none;background:#3A1F1F;border:1.5px solid var(--err);color:#FFD5D5;font-size:0.85rem;padding:10px 12px;border-radius:10px;margin-top:10px;}

  .success{display:none;text-align:center;padding:50px 10px 10px;}
  .success .check{width:64px;height:64px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:1.8rem;color:#0A1F12;}
  .success h2{font-family:'Bebas Neue',sans-serif;font-size:2.1rem;margin:0 0 10px;}
  .success p{color:var(--fog);font-size:0.95rem;line-height:1.5;margin:0 auto;max-width:32ch;}
</style>
</head>
<body>
<div class="wrap">

  <div id="formView">
    <div class="eyebrow">ARD Coaching</div>
    <h1 id="pageTitle">COMMENT S'EST<br>PASSÉE TA SÉANCE ?</h1>
    <p class="sub" id="pageSub">Note ce que tu as vraiment fait, ça me permet de suivre ta progression et d'ajuster le programme.</p>

    <form id="crForm">
      <div class="card">
        <div class="field">
          <label>Ton nom</label>
          <input type="text" id="nomClient" placeholder="Prénom Nom" required>
        </div>
        <div class="field">
          <label>Date de la séance</label>
          <input type="date" id="dateSeance" required>
        </div>
      </div>

      <div id="exercicesWrap"></div>
      <button type="button" class="btn btn-ghost" id="addExBtn" style="margin-bottom:16px;">+ Ajouter un exercice</button>

      <div class="card">
        <div class="field" style="margin-bottom:0;">
          <label>Remarques générales (optionnel)</label>
          <textarea id="notesGlobales" placeholder="Fatigue, douleur, motivation, tout ce que tu veux me dire..."></textarea>
        </div>
      </div>

      <button type="submit" class="btn btn-blue" id="submitBtn">
        <span class="fill" id="btnFill"></span>
        <span class="label" id="btnLabel">ENVOYER MON COMPTE-RENDU</span>
      </button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <div class="success" id="successView">
    <div class="check">✓</div>
    <h2>MERCI ! 💪</h2>
    <p>C'est bien reçu. Continue comme ça, les petites habitudes font les grandes transformations.</p>
  </div>

</div>

<script>
(function(){
  const $ = (s,r=document)=>r.querySelector(s);
  const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ---- UTF-8 safe base64 decode (matches the encoder used in the coach's builder tool) ----
  function b64uDecode(str){
    const b64 = decodeURIComponent(str);
    const bin = atob(b64);
    const percent = Array.prototype.map.call(bin, c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('');
    return JSON.parse(decodeURIComponent(percent));
  }

  // ---- read plan from URL hash (#d=...) if the coach sent a link ----
  let plan = null;
  const hash = window.location.hash;
  if(hash && hash.indexOf('d=') !== -1){
    try{
      const raw = hash.split('d=')[1];
      plan = b64uDecode(raw);
    }catch(e){ plan = null; }
  }

  let exercices = [];

  if(plan && Array.isArray(plan.exercises) && plan.exercises.length){
    $('#pageTitle').innerHTML = 'TA SÉANCE<br>DU JOUR';
    $('#pageSub').textContent = "Voici le programme préparé par ton coach. Remplis juste ce que tu as réellement fait.";
    exercices = plan.exercises.map(pe => ({
      id: uid(), locked: true,
      nom: pe.nom || '', seriesCible: pe.series || '', repCible: pe.repetitions || '',
      chargeCible: pe.charge || '', reposCible: pe.repos || '', notesCible: pe.notes || '',
      reps:'', charge:'', reussi:'', ressenti:''
    }));
    if(plan.client) $('#nomClient').value = plan.client;
    if(plan.date) $('#dateSeance').value = plan.date;
  } else {
    exercices = [{ id: uid(), locked:false, nom:'', seriesCible:'', repCible:'', chargeCible:'', reposCible:'', notesCible:'', reps:'', charge:'', reussi:'', ressenti:'' }];
  }

  function selectOptions(options, current){
    return options.map(([v,l])=>`<option value="${escapeHtml(v)}" ${v===current?'selected':''}>${escapeHtml(l)}</option>`).join('');
  }

  function objectifLine(ex){
    const parts = [];
    if(ex.seriesCible) parts.push(`${escapeHtml(ex.seriesCible)} séries`);
    if(ex.repCible) parts.push(`${escapeHtml(ex.repCible)} répét.`);
    if(ex.chargeCible) parts.push(`${escapeHtml(ex.chargeCible)}`);
    if(ex.reposCible) parts.push(`repos ${escapeHtml(ex.reposCible)}`);
    let line = parts.join(' · ') || 'Objectif libre';
    if(ex.notesCible) line += `<br><span style="opacity:0.85;">${escapeHtml(ex.notesCible)}</span>`;
    return line;
  }

  function renderExercices(){
    const wrap = $('#exercicesWrap');
    wrap.innerHTML = '';
    exercices.forEach((ex, idx)=>{
      const card = document.createElement('div');
      card.className = 'ex-card';
      const head = ex.locked
        ? `<div class="ex-head"><span class="ex-title">${escapeHtml(ex.nom)}</span></div>
           <div class="objectif-box"><b>Objectif :</b> ${objectifLine(ex)}</div>`
        : `<div class="ex-head">
             <input type="text" data-field="nom" placeholder="Nom de l'exercice" value="${escapeHtml(ex.nom)}">
             <button type="button" class="rm-btn" title="Retirer">✕</button>
           </div>`;
      card.innerHTML = `
        ${head}
        <div class="section-tag">Ce que tu as fait</div>
        <div class="row2">
          <div class="field"><label>Répét. faites</label><input type="text" data-field="reps" placeholder="10" value="${escapeHtml(ex.reps)}"></div>
          <div class="field"><label>Charge utilisée</label><input type="text" data-field="charge" placeholder="42kg" value="${escapeHtml(ex.charge)}"></div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Réussi ?</label>
            <select data-field="reussi">${selectOptions([['','—'],['Oui','Oui'],['Partiel','Partiel'],['Non','Non']], ex.reussi)}</select>
          </div>
          <div class="field">
            <label>Ressenti</label>
            <select data-field="ressenti">${selectOptions([['','—'],['😄 Facile','😄 Facile'],['🙂 Correct','🙂 Correct'],['😓 Difficile','😓 Difficile'],['🥵 Très dur','🥵 Très dur']], ex.ressenti)}</select>
          </div>
        </div>
      `;
      $$('input, select', card).forEach(inp=>{
        const evt = inp.tagName === 'SELECT' ? 'change' : 'input';
        inp.addEventListener(evt, ()=>{ exercices[idx][inp.dataset.field] = inp.value; });
      });
      if(!ex.locked){
        $('.rm-btn', card).addEventListener('click', ()=>{
          exercices.splice(idx,1);
          renderExercices();
        });
      }
      wrap.appendChild(card);
    });
  }
  renderExercices();

  $('#addExBtn').addEventListener('click', ()=>{
    exercices.push({ id: uid(), locked:false, nom:'', seriesCible:'', repCible:'', chargeCible:'', reposCible:'', notesCible:'', reps:'', charge:'', reussi:'', ressenti:'' });
    renderExercices();
  });

  if(!$('#dateSeance').value) $('#dateSeance').value = new Date().toISOString().slice(0,10);

  const form = $('#crForm');
  const submitBtn = $('#submitBtn');
  const btnFill = $('#btnFill');
  const btnLabel = $('#btnLabel');
  const errorMsg = $('#errorMsg');

  // === À CONFIGURER : colle ici l'URL de ton déploiement Google Apps Script (se termine par /exec) ===
  const SCRIPT_URL = "REMPLACE_MOI_PAR_URL_APPS_SCRIPT";

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    errorMsg.style.display = 'none';

    const nom = $('#nomClient').value.trim();
    const date = $('#dateSeance').value;
    const notesGlobales = $('#notesGlobales').value.trim();
    const validEx = exercices.filter(ex => ex.nom.trim() !== '');

    if(!nom){
      errorMsg.textContent = 'Merci d\u2019indiquer ton nom.';
      errorMsg.style.display = 'block';
      return;
    }
    if(validEx.length === 0){
      errorMsg.textContent = 'Ajoute au moins un exercice.';
      errorMsg.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    btnLabel.textContent = 'ENVOI...';
    btnFill.style.width = '100%';

    try{
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          nom, date, notesGlobales,
          exercices: validEx.map(ex => ({
            nom: ex.nom,
            seriesCible: ex.seriesCible, repCible: ex.repCible, chargeCible: ex.chargeCible, reposCible: ex.reposCible,
            reps: ex.reps, charge: ex.charge, reussi: ex.reussi, ressenti: ex.ressenti
          }))
        })
      });
      setTimeout(()=>{
        $('#formView').style.display = 'none';
        $('#successView').style.display = 'block';
      }, 400);
    } catch(err){
      submitBtn.disabled = false;
      btnLabel.textContent = 'ENVOYER MON COMPTE-RENDU';
      btnFill.style.width = '0%';
      errorMsg.textContent = "L'envoi a échoué, vérifie ta connexion et réessaie.";
      errorMsg.style.display = 'block';
    }
  });
})();
</script>
</body>
</html>
